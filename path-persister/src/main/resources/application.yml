spring:
  application:
    name: path-persister

  profiles:
    active: local

  # JPA Bulk Insert용 DB
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME}?reWriteBatchedInserts=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
    show-sql: false

  # Redis Stream
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 10

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.pathkeeper.persister: INFO