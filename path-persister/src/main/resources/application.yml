spring:
  application:
    name: path-persister

  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
    show-sql: false

  data:
    redis:
      lettuce:
        pool:
          max-active: 10

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.pathkeeper.persister: INFO