spring:
  application:
    name: path-persister

  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 1000
        order_inserts: true
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
    show-sql: false
    open-in-view: false

  data:
    redis:
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

persister:
  batch:
    interval-ms: 10000
    size: 1000

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.pathkeeper.persister: INFO
    org.hibernate.SQL: WARN