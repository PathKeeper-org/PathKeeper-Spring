global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: pathkeeper-local

scrape_configs:
  # Prometheus 자체
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API Server
  - job_name: 'api-server'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['api-server:8081']
        labels:
          service: 'api-server'

  # Location Processor
  - job_name: 'location-processor'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['location-processor:8082']
        labels:
          service: 'location-processor'

  # Alert Sender
  - job_name: 'alert-sender'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['alert-sender:8083']
        labels:
          service: 'alert-sender'

  # Path Persister
  - job_name: 'path-persister'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['path-persister:8084']
        labels:
          service: 'path-persister'