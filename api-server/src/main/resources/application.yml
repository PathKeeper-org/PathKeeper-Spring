spring:
  application:
    name: api-server

  profiles:
    active: local  # 운영 환경은 환경변수(SPRING_PROFILES_ACTIVE=prod)로 덮어씀

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: 1
      compression-type: lz4
      batch-size: 16384
      properties:
        linger.ms: 10

jwt:
  secret: ${SECRET_KEY}
  access-token-validity-in-milliseconds: 1800000
  refresh-token-validity-in-milliseconds: 1209600000

server:
  port: 8081
  tomcat:
    threads:
      max: 400
      min-spare: 50

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.pathkeeper.api: INFO
    org.hibernate.SQL: WARN
