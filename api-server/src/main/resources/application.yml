spring:
  application:
    name: api-server

  profiles:
    active: local  # 운영 환경은 환경변수(SPRING_PROFILES_ACTIVE=prod)로 덮어씀

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

jwt:
  secret: ${SECRET_KEY}
  access-token-validity-in-milliseconds: 1800000
  refresh-token-validity-in-milliseconds: 1209600000

server:
  port: 8081
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 200
    connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.pathkeeper.api: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
