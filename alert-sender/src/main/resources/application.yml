spring:
  application:
    name: alert-sender

  profiles:
    active: local

  # 보호자 정보 조회용 DB
  datasource:
    url: jdbc:postgresql://localhost:5433/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  # Redis (멱등성 키)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD}

  # Kafka Consumer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: alert-sender-group
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.pathkeeper.common.dto"
    listener:
      ack-mode: manual
      concurrency: 2

# FCM
fcm:
  credentials-path: ${FCM_CREDENTIALS:./fcm-credentials.json}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus, info
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.pathkeeper.alert: INFO