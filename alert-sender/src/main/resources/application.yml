spring:
  application:
    name: alert-sender

  profiles:
    active: local

  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

fcm:
  mock: ${FCM_MOCK:true}
  credentials-path: ${FCM_CREDENTIALS:/secrets/firebase-credentials.json}

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.pathkeeper.alert: INFO
    com.google.firebase: WARN
    org.springframework.kafka: WARN