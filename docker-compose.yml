version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: pathkeeper-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pathkeeper_data:/var/lib/postgresql/data
    restart: always


  redis:
    image: redis:latest
    container_name: pathkeeper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}

volumes:
  pathkeeper_data:
  redis-data: