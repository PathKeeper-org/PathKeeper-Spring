version: '3.8'

services:
  # === API Server (3 인스턴스) ===
  api-server:
    build:
      context: .
      dockerfile: api-server/Dockerfile
    image: pathkeeper/api-server:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pathkeeper_db}
      DB_USER: ${DB_USER:-pathkeeper_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
#      JAVA_OPTS: "-XX:+UseG1GC -Xmx400m -Xms200m"
      JAVA_OPTS: "-Xmx256m -Xms128m"
    deploy:
    # replicas: 3
      replicas: 2
      resources:
#        limits:
#          cpus: '1'
#          memory: 512M
#        reservations:
#          cpus: '0.5'
#          memory: 256M
        limits:
          cpus: '0.5'
          memory: 512M
    ports:
#      - "8081-8083:8081"
      - "8081-8082:8081"
    restart: unless-stopped
    networks:
      - pathkeeper-net

  # === Location Processor (10 인스턴스) ===
  location-processor:
    build:
      context: .
      dockerfile: location-processor/Dockerfile
    image: pathkeeper/location-processor:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pathkeeper_db}
      DB_USER: ${DB_USER:-pathkeeper_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
#      JAVA_OPTS: "-XX:+UseG1GC -Xmx512m -Xms256m"
      # heap(256m) + native(~256m) = ~512m → 컨테이너 limit과 일치
      JAVA_OPTS: "-Xmx256m -Xms128m"
    deploy:
    # replicas: 10
      replicas: 3
      resources:
#        limits:
#          cpus: '2'
#          memory: 1G
#        reservations:
#          cpus: '1'
#          memory: 512M
        limits:
          cpus: '1'
          memory: 512M
    restart: unless-stopped
    networks:
      - pathkeeper-net

  # === Alert Sender (2 인스턴스) ===
  alert-sender:
    build:
      context: .
      dockerfile: alert-sender/Dockerfile
    image: pathkeeper/alert-sender:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      KAFKA_BOOTSTRAP: kafka:9092
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pathkeeper_db}
      DB_USER: ${DB_USER:-pathkeeper_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FCM_CREDENTIALS: /secrets/fcm.json
      # heap(192m) + native(~160m) = ~352m → 384M 컨테이너에 안전하게 수용
      JAVA_OPTS: "-Xmx192m -Xms96m"
    volumes:
      - ./secrets:/secrets:ro
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 384M
    restart: unless-stopped
    networks:
      - pathkeeper-net

  # === Path Persister (1 인스턴스) ===
  path-persister:
    build:
      context: .
      dockerfile: path-persister/Dockerfile
    image: pathkeeper/path-persister:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-pathkeeper_db}
      DB_USER: ${DB_USER:-pathkeeper_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # heap(192m) + native(~150m) = ~342m → 384M 컨테이너에 안전하게 수용
      JAVA_OPTS: "-Xmx192m -Xms96m"
    deploy:
      replicas: 1
      resources:
#        limits:
#          cpus: '1'
#          memory: 512M
        limits:
          cpus: '0.5'
          memory: 384M
    restart: unless-stopped
    networks:
      - pathkeeper-net

  # === Nginx (로드 밸런서) ===
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-server
    restart: unless-stopped
    networks:
      - pathkeeper-net

# === External Network ===
networks:
  pathkeeper-net:
    external: true
    name: pathkeeper-net